name: Publish Selura Extension Store

on:
  pull_request:
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/publish-store.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - 'tests/**'
      - '.github/workflows/publish-store.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: selura-store-publish
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Run catalog and signer contract tests
        run: python3 -m unittest discover -s tests -v
      - name: Check Python syntax
        run: python3 -m compileall -q scripts tests

  publish:
    needs: test
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout publishing source
        uses: actions/checkout@v4
        with:
          persist-credentials: true
      - name: Require private release read-only token
        env:
          PRIVATE_RELEASE_TOKEN: ${{ secrets.SELURA_READER_READ_TOKEN }}
        run: |
          if [ -z "$PRIVATE_RELEASE_TOKEN" ]; then
            echo "::error::Missing SELURA_READER_READ_TOKEN repository secret. Set a fine-grained read-only Contents token restricted to john-selwyn/selura-reader."
            exit 1
          fi
      - name: Download the two previously tested signed APKs
        env:
          GH_TOKEN: ${{ secrets.SELURA_READER_READ_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/private-apks"
          gh release download test-selura-source-pr-25-run-12 \
            --repo john-selwyn/selura-reader \
            --pattern selura-nhentai.apk \
            --dir "$RUNNER_TEMP/private-apks"
          gh release download test-selura-mangadex-pr-26-run-3 \
            --repo john-selwyn/selura-reader \
            --pattern selura-mangadex.apk \
            --dir "$RUNNER_TEMP/private-apks"
          test -s "$RUNNER_TEMP/private-apks/selura-nhentai.apk"
          test -s "$RUNNER_TEMP/private-apks/selura-mangadex.apk"
          echo "Verified release files obtained from owner-authorized private source."
      - name: Generate public index, icons, APKs and manifest
        run: |
          set -euo pipefail
          sdk_dir="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          AAPT="$(find "$sdk_dir/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$sdk_dir/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$AAPT" && test -x "$APKSIGNER"
          python3 scripts/generate_store.py \
            --apk-dir "$RUNNER_TEMP/private-apks" \
            --output-dir "$RUNNER_TEMP/public-store" \
            --aapt "$AAPT" \
            --apksigner "$APKSIGNER"
          test -s "$RUNNER_TEMP/public-store/index.json"
          test -s "$RUNNER_TEMP/public-store/repo.json"
          test -s "$RUNNER_TEMP/public-store/apk/selura-nhentai.apk"
          test -s "$RUNNER_TEMP/public-store/apk/selura-mangadex.apk"
          sha256sum "$RUNNER_TEMP/public-store/apk/"*.apk
      - name: Publish generated files on dedicated public repo branch
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git ls-remote --exit-code --heads origin repo >/dev/null; then
            git fetch origin repo
            git switch -C repo FETCH_HEAD
          else
            git switch --orphan repo
          fi
          # Only a generated store branch is replaced. Never touch main,
          # private sources or device libraries.
          git rm -rf --ignore-unmatch . >/dev/null || true
          cp -R "$RUNNER_TEMP/public-store/." .
          git add -A
          if git diff --cached --quiet; then
            echo "Store files unchanged"
          else
            git commit -m "chore: publish verified signed Selura extension index"
            git push origin HEAD:repo
          fi
      - name: Show the add-store URL
        run: |
          echo "Selura store: https://raw.githubusercontent.com/john-selwyn/selura-extensions/repo/repo.json"
