name: Audit Published Extension APKs

on:
  pull_request:
    paths:
      - 'scripts/audit_extension_apks.py'
      - 'tests/test_audit_extension_apks.py'
      - '.github/workflows/audit-extension-apks.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/audit_extension_apks.py'
      - 'tests/test_audit_extension_apks.py'
      - '.github/workflows/audit-extension-apks.yml'
  workflow_dispatch:
  schedule:
    - cron: '15 3 * * 1'

permissions:
  contents: read

concurrency:
  group: seiryn-extension-audit-${{ github.ref }}
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout read-only audit code
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Validate static audit tests and Python source
        run: |
          set -euo pipefail
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q scripts tests

      - name: Download current live index and published APKs without modifying store
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/apks" "$RUNNER_TEMP/audit"
          curl --fail --location --retry 3 --max-time 60 --silent --show-error \
            "https://raw.githubusercontent.com/zexaldragneel/selura-extensions/repo/index.json" \
            --output "$RUNNER_TEMP/audit/index.json"
          PYTHONPATH=scripts python3 - "$RUNNER_TEMP/audit/index.json" "$RUNNER_TEMP/apks" <<'PY'
          import json, pathlib, subprocess, sys
          from audit_extension_apks import checked_catalog
          catalog = json.loads(pathlib.Path(sys.argv[1]).read_text())
          target = pathlib.Path(sys.argv[2])
          for spec, row in checked_catalog(catalog):
              # checked_catalog verifies the exact trusted origin and file mapping.
              url = row["resources"]["apkUrl"]
              dest = target / spec["filename"]
              subprocess.run(
                  ["curl", "--fail", "--location", "--retry", "3", "--max-time", "90",
                   "--silent", "--show-error", "--output", str(dest), url],
                  check=True, timeout=120,
              )
              if not dest.is_file() or dest.stat().st_size == 0:
                  raise RuntimeError("Missing published APK: " + spec["filename"])
          print("Retrieved all 43 exact public store APKs for independent audit.")
          PY

      - name: Independently verify real APK signatures, identities and permissions
        run: |
          set -euo pipefail
          sdk="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-}}"
          test -d "$sdk/build-tools"
          AAPT="$(find "$sdk/build-tools" -type f -name aapt | sort -V | tail -1)"
          APKSIGNER="$(find "$sdk/build-tools" -type f -name apksigner | sort -V | tail -1)"
          test -x "$AAPT" && test -x "$APKSIGNER"
          python3 scripts/audit_extension_apks.py \
            --catalog "$RUNNER_TEMP/audit/index.json" \
            --apk-dir "$RUNNER_TEMP/apks" \
            --aapt "$AAPT" \
            --apksigner "$APKSIGNER" \
            --output-dir "$RUNNER_TEMP/audit"

      - name: Add audit summary
        if: always()
        run: |
          if test -f "$RUNNER_TEMP/audit/extension_apk_audit.md"; then
            cat "$RUNNER_TEMP/audit/extension_apk_audit.md" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Audit did not reach real APK inspection; see failed steps." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload static audit evidence (no APKs or signing keys)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: published-extension-apk-security-audit
          path: |
            ${{ runner.temp }}/audit/extension_apk_audit.json
            ${{ runner.temp }}/audit/extension_apk_audit.md
          retention-days: 30
          if-no-files-found: warn
